# Publica una release cuando se empuja una etiqueta vX.Y.Z.
# El servidor la detecta con centinela-update y, segun su politica, la aplica.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar sintaxis PHP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l >/dev/null

      - name: Empaquetar y firmar por checksum
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG="centinela-${VER}.tar.gz"
          # Empaqueta el arbol sin .git ni ficheros de desarrollo
          tar czf "$PKG" --exclude='.git' --exclude='.github' \
              --transform "s,^\.,centinela-${VER}," .
          sha256sum "$PKG" > SHA256SUMS
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Crear la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG }}
            SHA256SUMS
          generate_release_notes: true
