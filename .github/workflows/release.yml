# Publica una release cuando se empuja una etiqueta vX.Y.Z.
# El servidor la detecta con centinela-update y, segun su politica, la aplica.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar sintaxis PHP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l >/dev/null

      - name: Empaquetar y firmar por checksum
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NAME="centinela-${VER}.tar.gz"
          # Se empaqueta fuera del arbol: si el tar.gz cayera dentro, tar se
          # leeria a si mismo y fallaria con «file changed as we read it».
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          tar czf "$OUT/$NAME" --exclude='.git' --exclude='.github' \
              --transform "s,^\.,centinela-${VER}," .
          (cd "$OUT" && sha256sum "$NAME" > SHA256SUMS)
          echo "PKG=$OUT/$NAME" >> "$GITHUB_ENV"
          echo "SUMS=$OUT/SHA256SUMS" >> "$GITHUB_ENV"

      - name: Crear la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG }}
            ${{ env.SUMS }}
          generate_release_notes: true
